[package]
name = "phonebridge2"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
rustls = { version = "=0.23.5", default-features = false, features = ["ring", "tls12", "std"] }
tokio-rustls = { version = "=0.26.0", default-features = false, features = ["ring"] }
rcgen = "0.13"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
zeroize = "=1.7.0"
time = "=0.3.36"

# Cross-platform desktop UI. Platform-specific integration stays behind UiBackend.
iced = { version = "0.13", default-features = false, features = ["tokio", "wgpu"] }

[[bin]]
name = "phonebridge2"
path = "src/main.rs"
