[package]
name = "phonebridge2"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
tokio = { version = "1", features = ["full"] }
rustls = { version = "=0.23.5", default-features = false, features = ["ring", "tls12", "std"] }
tokio-rustls = { version = "=0.26.0", default-features = false, features = ["ring"] }
rcgen = "0.13"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
zeroize = "=1.7.0"
time = "=0.3.36"
eframe = "0.31"
cpal = "0.15"
opus = "0.3"
crossbeam-channel = "0.5"
parking_lot = "0.12"
tokio-tungstenite = "0.23"

[[bin]]
name = "phonebridge2"
path = "src/main.rs"

[[bin]]
name = "phonebridge-pairing-demo"
path = "src/bin/pairing_demo.rs"
